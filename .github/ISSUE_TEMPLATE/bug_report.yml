name: 🐞 Bug report
description: Something on PracticeQAAutomation is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://www.practiceqaautomation.com/apps/bank
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser / tool
      placeholder: Chrome 128 · Playwright 1.47
